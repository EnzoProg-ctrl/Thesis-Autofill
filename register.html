<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Register your store as a tenant in the Nepo Mall Facility Issue Reporting System.">
  <title>Register — Nepo Mall FIRS</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--sp-6);
      background: var(--gray-50);
    }

    .auth-card {
      width: 100%;
      max-width: 540px;
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: var(--sp-8);
    }

    .auth-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: var(--sp-6);
    }
    .auth-logo .logo-icon {
      width: 48px;
      height: 48px;
      background: var(--primary-600);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: var(--sp-3);
    }
    .auth-logo .logo-title {
      font-size: var(--text-xl);
      font-weight: 700;
      color: var(--gray-900);
    }
    .auth-logo .logo-subtitle {
      font-size: var(--text-sm);
      color: var(--gray-500);
      margin-top: var(--sp-1);
    }

    .auth-form .form-group {
      margin-bottom: var(--sp-5);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-4);
    }

    .auth-submit {
      width: 100%;
      padding: 12px;
      font-size: var(--text-base);
      margin-top: var(--sp-2);
    }

    .auth-divider {
      text-align: center;
      margin: var(--sp-6) 0;
      position: relative;
    }
    .auth-divider::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: var(--gray-200);
    }
    .auth-divider span {
      background: #fff;
      padding: 0 var(--sp-3);
      position: relative;
      font-size: var(--text-xs);
      color: var(--gray-400);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .auth-alt {
      text-align: center;
      font-size: var(--text-sm);
      color: var(--gray-500);
    }
    .auth-alt a {
      color: var(--primary-600);
      font-weight: 500;
      text-decoration: none;
    }
    .auth-alt a:hover { text-decoration: underline; }

    .auth-footer {
      text-align: center;
      margin-top: var(--sp-6);
      font-size: var(--text-xs);
      color: var(--gray-400);
    }

    .auth-error {
      background: var(--danger-50);
      border: 1px solid var(--danger-100);
      color: var(--danger-600);
      border-radius: var(--radius-md);
      padding: var(--sp-3) var(--sp-4);
      font-size: var(--text-sm);
      margin-bottom: var(--sp-5);
      display: none;
      align-items: center;
      gap: var(--sp-2);
    }
    .auth-error.show { display: flex; }

    .auth-success {
      background: var(--success-50);
      border: 1px solid var(--success-100);
      color: var(--success-700);
      border-radius: var(--radius-md);
      padding: var(--sp-4);
      font-size: var(--text-sm);
      margin-bottom: var(--sp-5);
      display: none;
      text-align: center;
    }
    .auth-success.show { display: block; }
    .auth-success .success-title {
      font-weight: 600;
      font-size: var(--text-base);
      margin-bottom: var(--sp-2);
    }

    .password-strength {
      height: 4px;
      background: var(--gray-200);
      border-radius: var(--radius-full);
      margin-top: var(--sp-2);
      overflow: hidden;
    }
    .password-strength-fill {
      height: 100%;
      border-radius: var(--radius-full);
      transition: width 0.2s ease, background 0.2s ease;
      width: 0%;
    }

    /* Password toggle */
    .password-wrapper {
      position: relative;
    }

    .password-wrapper .form-input {
      padding-right: 42px;
    }

    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--gray-500);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 150ms ease;
    }

    .password-toggle:hover {
      color: var(--gray-700);
    }

    /* Data Privacy consent checkbox */
    .privacy-consent {
      margin-top: var(--sp-2);
      margin-bottom: var(--sp-5);
      padding: var(--sp-4);
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
    }
    .privacy-consent.error {
      border-color: var(--danger-400);
      background: var(--danger-50);
    }
    .privacy-consent label {
      display: flex;
      align-items: flex-start;
      gap: var(--sp-3);
      cursor: pointer;
      font-size: var(--text-sm);
      color: var(--gray-700);
      line-height: 1.5;
    }
    .privacy-consent input[type="checkbox"] {
      margin-top: 3px;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      accent-color: var(--primary-600);
      cursor: pointer;
    }
    .privacy-consent .privacy-link {
      color: var(--primary-600);
      text-decoration: underline;
      cursor: pointer;
    }
    .privacy-consent .privacy-link:hover {
      color: var(--primary-700);
    }

    @media (max-width: 540px) {
      .form-row { grid-template-columns: 1fr; }
      .auth-card { padding: var(--sp-6); }
    }
    @media (max-width: 480px) {
      .auth-card {
        border: none;
        background: transparent;
      }
    }
  </style>
</head>
<body>
  <div class="auth-page">

    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">N</div>
        <div class="logo-title">Nepo Mall</div>
        <div class="logo-subtitle" id="logoSubtitle">Register Your Store</div>
      </div>

      <div class="auth-error" id="authError">
        <span><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></span>
        <span id="authErrorText">Something went wrong.</span>
      </div>

      <div class="auth-success" id="authSuccess">
        <div class="success-title"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;margin-right:6px;color:var(--success-600)"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>Registration Successful!</div>
        <p id="successText">Your tenant account has been created. You can now sign in.</p>
        <a href="index.html" class="btn btn-primary" style="margin-top:var(--sp-4);display:inline-flex;">Go to Sign In</a>
      </div>

      <form id="registerForm" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="storeName">Store / Business Name <span class="required">*</span></label>
          <input type="text" id="storeName" class="form-input" placeholder="e.g., Jollibee, Mercury Drug" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="storeFloor">Store Location (Floor) <span class="required">*</span></label>
          <select id="storeFloor" class="form-select" required>
            <option value="" disabled selected>— Select Floor —</option>
            <option value="1F">1F — First Floor</option>
            <option value="2F">2F — Second Floor</option>
            <option value="3F">3F — Third Floor</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="contactPerson">Contact Person <span class="required">*</span></label>
            <input type="text" id="contactPerson" class="form-input" placeholder="Full name" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="phoneNumber">Phone Number <span class="required">*</span></label>
            <input type="tel" id="phoneNumber" class="form-input" placeholder="09171234567" maxlength="11" required>
          </div>
        </div>

        <div class="form-group" id="emailGroup">
          <label class="form-label" for="regEmail">Email Address <span class="required">*</span></label>
          <input type="email" id="regEmail" class="form-input" placeholder="store@example.com" autocomplete="email" required>
          <div class="form-hint">This will be used to sign in to the system.</div>
        </div>

        <div class="form-row" id="passwordRow">
          <div class="form-group">
            <label class="form-label" for="regPassword">Password <span class="required">*</span></label>
            <div class="password-wrapper">
              <input type="password" id="regPassword" class="form-input" placeholder="At least 8 characters" autocomplete="new-password" required>
              <button type="button" class="password-toggle" data-target="regPassword" aria-label="Show password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <div class="password-strength">
              <div class="password-strength-fill" id="passwordStrengthFill"></div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="regConfirm">Confirm Password <span class="required">*</span></label>
            <div class="password-wrapper">
              <input type="password" id="regConfirm" class="form-input" placeholder="Re-type password" autocomplete="new-password" required>
              <button type="button" class="password-toggle" data-target="regConfirm" aria-label="Show password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="privacy-consent" id="privacyConsentBox">
          <label for="privacyConsent">
            <input type="checkbox" id="privacyConsent" name="privacyConsent">
            <span>
              I consent to the collection, use, and processing of my personal information as described above, in accordance with
              <a href="https://www.privacy.gov.ph/data-privacy-act/" target="_blank" rel="noopener noreferrer" class="privacy-link">Republic Act No. 10173</a>
              (Data Privacy Act of 2012). I understand that my data will be used solely for facility issue reporting and tenant management within the Nepo Mall system.
            </span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary auth-submit" id="registerBtn">
          Create Tenant Account
        </button>
      </form>

      <div class="auth-divider"><span>or</span></div>

      <div class="auth-alt">
        Already registered? <a href="index.html">Sign in.</a>
      </div>
    </div>

    <div class="auth-footer">
      © 2026 Nepo Mall Angeles City — FIRS v1.0
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script type="module">
    import { supabase } from './js/supabase-client.js';

    const form = document.getElementById('registerForm');
    const authError = document.getElementById('authError');
    const authErrorText = document.getElementById('authErrorText');
    const authSuccess = document.getElementById('authSuccess');
    const registerBtn = document.getElementById('registerBtn');
    const passwordInput = document.getElementById('regPassword');
    const confirmInput = document.getElementById('regConfirm');
    const strengthFill = document.getElementById('passwordStrengthFill');
    const emailInput = document.getElementById('regEmail');
    const emailGroup = document.getElementById('emailGroup');
    const passwordRow = document.getElementById('passwordRow');
    const logoSubtitle = document.getElementById('logoSubtitle');
    const successText = document.getElementById('successText');

    /* ============================================================
       FINISH-SETUP MODE

       Registering is two operations that cannot share a transaction: an Auth
       API call that creates the login, then an INSERT that creates the store
       record. If the second fails the first is not undone, and the result is
       an account that authenticates and has no identity in the app — it
       cannot register again (the address is taken) and cannot sign in
       (there is nothing to sign in AS). One such account sat stuck in the
       live project for three weeks before anyone noticed.

       Rather than delete the login and make the tenant start over, this page
       finishes it. On load, a signed-in visitor with no tenants row and no
       profiles row is shown the store fields alone; submitting runs only the
       INSERT, against the session they already hold. index.html routes such a
       sign-in here, so the recovery also works on a later visit and not only
       in the tab where it broke.

       The consent checkbox stays visible: privacy_consented_at lives on the
       tenants row, so it was never recorded either.
       ============================================================ */
    let finishSetupUser = null;

    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;

      const uid = session.user.id;
      const [tenantRes, profileRes] = await Promise.all([
        supabase.from('tenants').select('id').eq('id', uid).maybeSingle(),
        supabase.from('profiles').select('id').eq('id', uid).maybeSingle(),
      ]);

      /* maybeSingle() reports "no row" as data:null with NO error, so a
         genuine failure looks identical to a missing account unless the error
         is checked. Without this, one dropped request on mall wifi would tell
         a tenant with a perfectly good account that their store details were
         never saved. When we cannot tell, do nothing. */
      if (tenantRes.error || profileRes.error) return;

      // A complete account has no business on this page — leave the form as it
      // is so a signed-in tenant who wanders here just sees normal registration.
      if (tenantRes.data || profileRes.data) return;

      /* An internal address cannot be self-registered as a tenant, and
         finishing setup must not become the way around that rule. An orphaned
         internal login is an administrative problem, not a tenant one. */
      const addr = (session.user.email || '').toLowerCase();
      if (addr.endsWith('@nepomall.com') || addr.endsWith('@nepomall-pmo.com')) {
        showError('This account is not set up. Please contact administration.');
        return;
      }

      enterFinishSetupMode(session.user);
    })();

    function enterFinishSetupMode(user, message) {
      finishSetupUser = user;
      emailGroup.style.display = 'none';
      passwordRow.style.display = 'none';
      emailInput.value = user.email || '';
      logoSubtitle.textContent = 'Finish Setting Up Your Store';
      registerBtn.textContent = 'Complete Registration';
      showNotice(message
        || 'Your login was created, but your store details were never saved. '
         + 'Fill them in below to finish — you do not need to register again.');
    }

    // Password strength indicator
    passwordInput.addEventListener('input', function() {
      const val = this.value;
      let strength = 0;
      if (val.length >= 6) strength++;
      if (val.length >= 10) strength++;
      if (/[A-Z]/.test(val)) strength++;
      if (/[0-9]/.test(val)) strength++;
      if (/[^A-Za-z0-9]/.test(val)) strength++;

      const percent = (strength / 5) * 100;
      strengthFill.style.width = percent + '%';

      if (strength <= 1) strengthFill.style.background = 'var(--danger-500)';
      else if (strength <= 3) strengthFill.style.background = 'var(--warning-500)';
      else strengthFill.style.background = 'var(--success-500)';
    });

    function resetButton() {
      registerBtn.disabled = false;
      registerBtn.textContent = finishSetupUser
        ? 'Complete Registration'
        : 'Create Tenant Account';
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      authError.classList.remove('show');

      const storeName = document.getElementById('storeName').value.trim();
      const floor = document.getElementById('storeFloor').value;
      const contact = document.getElementById('contactPerson').value.trim();
      const phone = document.getElementById('phoneNumber').value.trim();
      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;
      const confirm = confirmInput.value;

      // Store details — required in both modes.
      if (!storeName) return showError('Please enter your store or business name.');
      if (!floor) return showError('Please select your store floor.');
      if (!contact) return showError('Please enter the contact person name.');
      if (!phone) return showError('Please enter a phone number.');
      if (!/^\d{11}$/.test(phone)) return showError('Phone number must be exactly 11 digits (e.g., 09171234567).');

      /* Credentials — only when creating the login. In finish-setup mode it
         already exists, the fields are hidden, and re-validating them would
         block the submit on inputs the tenant cannot see. */
      if (!finishSetupUser) {
        if (!email) return showError('Please enter an email address.');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('Please enter a valid email address.');

        /* Misspelled domains. A format check cannot catch these — gmai.com is
           perfectly valid syntax, and it is a real registered domain, so mail
           sent there simply disappears. These are the misspellings of common
           providers; every one of them is a typo rather than a choice, so the
           submit is blocked with a suggestion.

           NOT an allowlist. Business domains are legitimate and unpredictable
           — jollibee.com.ph is already a registered tenant here — so only
           known-wrong spellings are rejected, never unknown ones.

           This catches the domain. It cannot catch a misspelled mailbox, e.g.
           juandelacruzz@gmail.com. Only the confirmation email proves that. */
        const DOMAIN_TYPOS = {
          'gmai.com': 'gmail.com',   'gmial.com': 'gmail.com',
          'gmaill.com': 'gmail.com', 'gamil.com': 'gmail.com',
          'gnail.com': 'gmail.com',  'gmaul.com': 'gmail.com',
          'gmail.co': 'gmail.com',   'gmail.con': 'gmail.com',
          'gmail.cm': 'gmail.com',   'gmail.comm': 'gmail.com',
          'yaho.com': 'yahoo.com',   'yahooo.com': 'yahoo.com',
          'yhaoo.com': 'yahoo.com',  'yahoo.co': 'yahoo.com',
          'yahoo.con': 'yahoo.com',  'yahoo.cm': 'yahoo.com',
          'hotmial.com': 'hotmail.com', 'hotmai.com': 'hotmail.com',
          'hotmall.com': 'hotmail.com', 'hotmail.co': 'hotmail.com',
          'hotmail.con': 'hotmail.com',
          'outlok.com': 'outlook.com',  'outllok.com': 'outlook.com',
          'outook.com': 'outlook.com',  'outlook.co': 'outlook.com',
          'iclod.com': 'icloud.com',    'iclound.com': 'icloud.com',
          'icloud.co': 'icloud.com'
        };

        const domain = email.slice(email.lastIndexOf('@') + 1);
        const suggestion = DOMAIN_TYPOS[domain];
        if (suggestion) {
          emailInput.classList.add('error');
          emailInput.focus();
          return showError('Did you mean ' + email.slice(0, email.lastIndexOf('@') + 1)
            + suggestion + '? Please check your email address.');
        }
        emailInput.classList.remove('error');
        if (password.length < 8) return showError('Password must be at least 8 characters.');
        if (password !== confirm) return showError('Passwords do not match.');

        // Internal (admin/staff) domains are not self-service.
        if (email.endsWith('@nepomall.com') || email.endsWith('@nepomall-pmo.com')) {
          return showError('Admin accounts cannot be registered here. Contact administration.');
        }
      }

      // Data Privacy consent validation
      const privacyCheckbox = document.getElementById('privacyConsent');
      const privacyBox = document.getElementById('privacyConsentBox');
      if (!privacyCheckbox.checked) {
        privacyBox.classList.add('error');
        return showError('You must agree to the Data Privacy Act consent to create an account.');
      }
      privacyBox.classList.remove('error');

      registerBtn.disabled = true;
      registerBtn.textContent = finishSetupUser ? 'Saving...' : 'Creating account...';

      /* Captured BEFORE signUp. finishSetupUser answers "is the page in
         finish-setup mode", and signUp below sets it so a failed INSERT can
         retry — which would otherwise make a perfectly normal registration
         report itself as a recovery on the success screen. These are two
         different questions and need two variables. */
      const wasFinishSetup = finishSetupUser !== null;
      let recoveryUser = finishSetupUser;
      let needsConfirmation = false;

      let userId, userEmail;

      /* Writing the store row from the browser only works while a session
         exists. Kept for the finish-setup path, and as a fallback in case
         migration_007's trigger has not been applied yet. */
      const writeTenantRow = async (id, mail) =>
        (await supabase.from('tenants').insert({
          id: id,
          store_name: storeName,
          floor: floor,
          contact_person: contact,
          phone_number: phone,
          email: mail,
          privacy_consented_at: new Date().toISOString()
        })).error;

      if (wasFinishSetup) {
        userId = finishSetupUser.id;
        // Normalised for the same reason the signUp path lowercases: tenants.email
        // carries a UNIQUE constraint and must not depend on how it was typed.
        userEmail = (finishSetupUser.email || '').trim().toLowerCase();

        const insertError = await writeTenantRow(userId, userEmail);
        if (insertError) {
          resetButton();
          return enterFinishSetupMode(recoveryUser,
            'Saving your store details failed (' + insertError.message
            + '). Press Complete Registration to try again.');
        }
      } else {
        const { data, error } = await supabase.auth.signUp({
          email: email,
          password: password,
          /* The store details travel WITH the signUp and are written to
             public.tenants by the handle_new_tenant trigger (migration_007).
             They are deliberately not inserted from here: once email
             confirmation is enabled, signUp returns no session, the browser is
             still anon, and the tenants_insert_self policy rejects the write.
             Moving it into the database is what allows confirmation to be
             turned on without breaking registration. */
          options: {
            data: {
              store_name: storeName,
              floor: floor,
              contact_person: contact,
              phone_number: phone
            }
          }
        });

        if (error) {
          resetButton();
          return showError(error.message);
        }
        if (!data || !data.user) {
          resetButton();
          return showError('Account creation did not complete. Please try again.');
        }

        /* Already registered. With email confirmation on, Supabase does not
           say so — it returns no error and a placeholder user with a null
           session, so this path is indistinguishable from a real signup and
           the tenant would be told to check an inbox that never receives
           anything. The giveaway is an empty identities array, which is the
           documented way to detect the obfuscated response.

           Harmless without this check — no duplicate account or tenants row is
           created either way — but the tenant is left waiting on a link that
           does not exist.

           Redundant if email enumeration protection is disabled in the
           dashboard: signUp then returns a real error and the branch above
           catches it first. Kept so registration behaves correctly under
           either setting. */
        if (Array.isArray(data.user.identities) && data.user.identities.length === 0) {
          resetButton();
          emailInput.classList.add('error');
          emailInput.focus();
          return showError('This email is already registered. Please sign in instead, '
            + 'or use "Forgot password" if you cannot get in.');
        }

        userId = data.user.id;
        userEmail = email;

        /* No session means email confirmation is ON and the address has not
           been proven yet. The trigger has already written the store row, so
           there is nothing to retry — the tenant only has to click the link. */
        needsConfirmation = !data.session;

        if (data.session) {
          recoveryUser = data.user;

          /* Confirm the trigger actually ran. If migration_007 has not been
             applied, this catches it here instead of leaving the tenant with a
             login and no store record — the exact failure this change exists
             to prevent. */
          const { data: row } = await supabase
            .from('tenants').select('id').eq('id', userId).maybeSingle();

          if (!row) {
            const insertError = await writeTenantRow(userId, userEmail);
            if (insertError) {
              resetButton();
              return enterFinishSetupMode(recoveryUser,
                'Your login was created, but saving your store details failed ('
                + insertError.message + '). Press Complete Registration to try again.');
            }
          }
        }
      }

      // Show success
      form.style.display = 'none';
      successText.textContent = wasFinishSetup
        ? 'Your store details have been saved. You can now sign in.'
        : needsConfirmation
          ? 'Your tenant account has been created. We sent a confirmation link to '
            + userEmail + '. Please open it to activate your account, then sign in.'
          : 'Your tenant account has been created. You can now sign in.';
      authError.classList.remove('show');
      authSuccess.classList.add('show');
      resetButton();
    });

    function showError(msg) {
      authError.style.background = '';
      authError.style.borderColor = '';
      authError.style.color = '';
      authErrorText.textContent = msg;
      authError.classList.add('show');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* Same banner, neutral colours. "Finish setting up your store" is an
       instruction, not a failure, and the red styling would read as one. */
    function showNotice(msg) {
      authError.style.background = 'var(--primary-50, #eff6ff)';
      authError.style.borderColor = 'var(--primary-100, #dbeafe)';
      authError.style.color = 'var(--primary-700, #1d4ed8)';
      authErrorText.textContent = msg;
      authError.classList.add('show');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Password show/hide toggles
    document.querySelectorAll('.password-toggle').forEach(function(btn) {
      btn.addEventListener('click', function() {
        const targetId = this.getAttribute('data-target');
        const input = document.getElementById(targetId);
        if (!input) return;
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        this.innerHTML = isPassword
          ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>'
          : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
        this.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      });
    });
  </script>
</body>
</html>
