# Static hosting for the FIRS web application.
#
# The headers match vercel.json, so the local copy behaves like the deployed
# site, including the camera permission the photo upload uses.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
