<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nepo Mall — Human-in-the-Loop Validation Interface for AI-classified facility issues.">
  <title>HITL Validation — Nepo Mall Admin</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
  <style>
    /* HITL two-column layout */
    .hitl-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: var(--sp-6);
      align-items: start;
    }
    .hitl-stats { position: sticky; top: calc(var(--header-h) + var(--sp-6)); }

    /* Segmented priority control for HITL */
    .priority-segmented {
      display: inline-flex;
      background: var(--gray-100);
      border-radius: var(--radius-md);
      padding: 3px;
      border: 1px solid var(--gray-200);
      flex-wrap: wrap;
    }
    .priority-seg-btn {
      padding: 7px 14px;
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--gray-500);
      background: transparent;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all var(--ease-fast);
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .priority-seg-btn:hover:not(.active) { color: var(--gray-700); }
    .priority-seg-btn.active { color: #fff; box-shadow: var(--shadow-xs); }
    .priority-seg-btn.active[data-priority="critical"] { background: var(--priority-critical); }
    .priority-seg-btn.active[data-priority="high"]     { background: var(--priority-high); }
    .priority-seg-btn.active[data-priority="medium"]   { background: var(--priority-medium); }
    .priority-seg-btn.active[data-priority="low"]      { background: var(--priority-low); }

    .hitl-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--sp-4) var(--sp-6);
      border-bottom: 1px solid var(--gray-200);
      background: var(--gray-50);
    }
    .hitl-card-header .issue-id {
      font-size: var(--text-sm);
      font-weight: 700;
      color: var(--gray-700);
    }

    .ai-detail-row {
      display: flex;
      align-items: flex-start;
      gap: var(--sp-6);
      flex-wrap: wrap;
    }
    .ai-detail-item { flex: 1; min-width: 180px; }
    .ai-detail-item .detail-label {
      font-size: var(--text-xs);
      color: var(--gray-500);
      font-weight: 500;
      margin-bottom: var(--sp-2);
    }

    .override-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-4);
    }

    .ai-reasoning {
      font-size: var(--text-sm);
      color: var(--gray-500);
      line-height: var(--lh-relaxed);
      margin-top: var(--sp-3);
    }

    .hitl-card .tenant-row {
      display: flex;
      align-items: center;
      gap: var(--sp-4);
      flex-wrap: wrap;
      font-size: var(--text-sm);
    }
    .hitl-card .tenant-name {
      font-weight: 600;
      color: var(--gray-800);
    }
    .hitl-card .tenant-meta {
      color: var(--gray-500);
    }

    @media (max-width: 1024px) {
      .hitl-grid { grid-template-columns: 1fr; }
      .hitl-stats { position: static; }
    }
    @media (max-width: 640px) {
      .override-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="admin-layout">

    <!-- ===== Sidebar ===== -->
    <aside class="admin-sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="../index.html" class="logo">
          <div class="logo-icon">N</div>
          <div>
            <div class="logo-text">Nepo Mall</div>
            <div class="logo-sub">PMO Admin Panel</div>
          </div>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Main Menu</div>
        <a href="index.html" class="sidebar-link">
          <span class="link-icon">📊</span> Dashboard
        </a>
        <a href="hitl.html" class="sidebar-link active">
          <span class="link-icon">🔍</span> HITL Review
          <span class="link-badge" id="sidebar-badge">0</span>
        </a>
        <a href="analytics.html" class="sidebar-link">
          <span class="link-icon">📈</span> Analytics
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="#" onclick="event.preventDefault(); sessionStorage.removeItem('firs_user'); window.location.replace('../index.html');">
          <span>🚪</span> Sign Out
        </a>
      </div>
    </aside>

    <!-- ===== Content ===== -->
    <div class="admin-content">

      <!-- Top Bar -->
      <header class="admin-topbar">
        <div class="flex items-center gap-3">
          <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
          <span class="topbar-title">HITL Validation</span>
        </div>
        <div class="topbar-right">
          <div class="topbar-user">
            <div class="topbar-avatar">A</div>
            <span class="hide-mobile">Admin</span>
          </div>
        </div>
      </header>

      <!-- Page Body -->
      <main class="admin-page">

        <!-- Queue Info Banner -->
        <div class="hitl-queue-info" id="queue-info">
          ⚡ <span id="queue-count">0</span> issues awaiting expert validation
        </div>

        <!-- Two Column Layout -->
        <div class="hitl-grid">

          <!-- Left Column: Review Cards -->
          <div id="review-cards">
            <!-- Cards rendered by JS -->
          </div>

          <!-- Right Column: Validation Statistics -->
          <div>
            <div class="hitl-stats" id="stats-panel">
              <h4>📊 Validation Statistics</h4>
              <div class="stat-row">
                <span class="stat-label">Total Validated</span>
                <span class="stat-value" id="stat-total">0</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">AI Agreement Rate</span>
                <span class="stat-value" id="stat-agreement">0%</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Most Overridden Category</span>
                <span class="stat-value" id="stat-overridden-cat">—</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Avg Confidence of Overrides</span>
                <span class="stat-value" id="stat-avg-conf">—</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Today's Validations</span>
                <span class="stat-value" id="stat-today">0</span>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script type="module" src="../js/hitl.js"></script>
</body>
</html>
