<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Nepo Mall FIRS — Staff Work Queue">
  <title>My Work Queue — Nepo Mall FIRS</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

  <div class="admin-layout">

    <!-- ========== SIDEBAR ========== -->
    <aside class="admin-sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="staff.html" class="logo">
          <div class="logo-icon">N</div>
          <div>
            <div class="logo-text">Nepo Mall</div>
            <div class="logo-sub">Staff Portal</div>
          </div>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-section-label">MAIN MENU</div>
        <a href="staff.html" class="sidebar-link active">
          <span class="link-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="7" height="9" x="3" y="3" rx="1"></rect>
              <rect width="7" height="5" x="14" y="3" rx="1"></rect>
              <rect width="7" height="9" x="14" y="12" rx="1"></rect>
              <rect width="7" height="5" x="3" y="16" rx="1"></rect>
            </svg></span> Dashboard
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="#" id="edit-profile-link" style="margin-bottom: var(--sp-3);"><span class="link-icon"><svg
              xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
              <path d="m15 5 4 4"></path>
            </svg></span> Edit Profile</a>
        <a href="#" id="sign-out-link">
          <span class="link-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg></span> Sign Out
        </a>
      </div>
    </aside>

    <!-- ========== CONTENT ========== -->
    <main class="admin-content">

      <!-- Top Bar -->
      <header class="admin-topbar">
        <div class="flex items-center gap-4">
          <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar"><svg
              xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" x2="20" y1="12" y2="12"></line>
              <line x1="4" x2="20" y1="6" y2="6"></line>
              <line x1="4" x2="20" y1="18" y2="18"></line>
            </svg></button>
          <span class="topbar-title">Dashboard</span>
        </div>
        <div class="topbar-right">
          <div class="flex items-center gap-2 text-sm" style="color: var(--success-600);">
            <span class="live-dot"></span> Live
          </div>
          <div class="topbar-user">
            <!-- Filled by shared.js renderTopbarUser(): a staff member sees
                 their TRADE here, an admin sees "Admin". Left empty on
                 purpose — a hardcoded value would visibly change once JS
                 runs, which is the flicker the old initials pill had. -->
            <span class="topbar-role"></span>
            <span class="topbar-name hide-mobile"></span>
          </div>
        </div>
      </header>

      <!-- Page Body -->
      <div class="admin-page">

        <!-- KPI Cards -->
        <div class="kpi-grid" id="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">Assigned to Me</div>
            <div class="kpi-value" id="kpi-assigned">—</div>
            <div class="kpi-trend" id="kpi-assigned-trend"></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">In Progress</div>
            <div class="kpi-value" id="kpi-inprogress" style="color: var(--primary-600);">—</div>
            <div class="kpi-trend" id="kpi-inprogress-trend"></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Resolved by Me</div>
            <div class="kpi-value" id="kpi-resolved" style="color: var(--success-600);">—</div>
            <div class="kpi-trend" id="kpi-resolved-trend"></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Critical Issues</div>
            <div class="kpi-value pulse" id="kpi-critical" style="color: var(--danger-600);">—</div>
            <div class="kpi-trend" id="kpi-critical-trend"></div>
          </div>
        </div>

        <!-- View Controls -->
        <div class="view-controls">
          <div class="segmented-control" id="view-toggle">
            <button class="segmented-btn active" data-view="kanban">Kanban</button>
            <button class="segmented-btn" data-view="table">Table</button>
          </div>
          <div class="filter-bar" id="filter-bar" style="margin-bottom:0; flex:1; justify-content:flex-end;">
            <select class="form-select" id="filter-category">
              <option value="">All Categories</option>
            </select>
            <select class="form-select" id="filter-priority">
              <option value="">All Priorities</option>
            </select>
            <select class="form-select" id="filter-status">
              <option value="">All Statuses</option>
            </select>
          </div>
        </div>

        <!-- Kanban Board -->
        <div class="kanban-board" id="kanban-board"></div>

        <!-- Data Table (hidden by default) -->
        <div class="table-container hidden" id="table-container">
          <table class="data-table" id="data-table">
            <thead>
              <tr>
                <th data-sort="id">ID <span class="sort-icon">↕</span></th>
                <th data-sort="tenant">Tenant <span class="sort-icon">↕</span></th>
                <th data-sort="category">Category <span class="sort-icon">↕</span></th>
                <th data-sort="priority" title="Model severity index (0-100), derived from the full probability distribution. The Priority badge is the operational level.">Severity Index <span class="sort-icon">↕</span></th>
                <th data-sort="status">Status <span class="sort-icon">↕</span></th>
                <th data-sort="submitted">Submitted <span class="sort-icon">↕</span></th>
                <th data-sort="assigned">Assigned To <span class="sort-icon">↕</span></th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>

      </div><!-- .admin-page -->
    </main>
  </div><!-- .admin-layout -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script type="module" src="../js/staff-dashboard.js"></script>
</body>

</html>
