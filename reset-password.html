<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Set a new password for your Nepo Mall FIRS account.">
  <title>Reset Password — Nepo Mall FIRS</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--sp-6);
      background: var(--gray-50);
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: var(--sp-8);
    }

    .auth-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: var(--sp-6);
    }

    .auth-logo .logo-icon {
      width: 48px;
      height: 48px;
      background: var(--primary-600);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: var(--sp-3);
    }

    .auth-logo .logo-title {
      font-size: var(--text-xl);
      font-weight: 700;
      color: var(--gray-900);
    }

    .auth-logo .logo-subtitle {
      font-size: var(--text-sm);
      color: var(--gray-500);
      margin-top: var(--sp-1);
    }

    .auth-form .form-group {
      margin-bottom: var(--sp-5);
    }

    .auth-submit {
      width: 100%;
      padding: 12px;
      font-size: var(--text-base);
      font-weight: 600;
      color: #fff;
      background: var(--primary-600);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background var(--ease-fast);
    }

    .auth-submit:hover:not(:disabled) {
      background: var(--primary-700);
      color: #fff;
    }

    .auth-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .auth-error,
    .auth-success {
      border-radius: var(--radius-md);
      padding: var(--sp-4);
      font-size: var(--text-sm);
      margin-bottom: var(--sp-5);
      display: none;
      text-align: center;
    }

    .auth-error {
      background: var(--danger-50);
      border: 1px solid var(--danger-100);
      color: var(--danger-600);
    }

    .auth-success {
      background: var(--success-50);
      border: 1px solid var(--success-100);
      color: var(--success-700);
    }

    .auth-error.show,
    .auth-success.show {
      display: block;
    }

    .auth-success .success-title {
      font-weight: 600;
      font-size: var(--text-base);
      margin-bottom: var(--sp-2);
    }

    .password-strength {
      height: 4px;
      background: var(--gray-200);
      border-radius: var(--radius-full);
      margin-top: var(--sp-2);
      overflow: hidden;
    }

    .password-strength-fill {
      height: 100%;
      width: 0%;
      border-radius: var(--radius-full);
      transition: width 0.2s ease, background 0.2s ease;
    }

    .auth-alt {
      text-align: center;
      font-size: var(--text-sm);
      color: var(--gray-600);
      margin-top: var(--sp-5);
    }

    .auth-alt a {
      color: var(--primary-600);
      font-weight: 500;
    }

    .auth-alt a:hover {
      text-decoration: underline;
    }

    .auth-footer {
      margin-top: var(--sp-6);
      font-size: var(--text-xs);
      color: var(--gray-400);
      text-align: center;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: var(--sp-6);
      }
    }
  </style>
</head>

<body>
  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="logo-icon">N</div>
        <div class="logo-title">Nepo Mall</div>
        <div class="logo-subtitle">Set a New Password</div>
      </div>

      <div class="auth-error" id="authError">
        <span id="authErrorText">Something went wrong.</span>
      </div>

      <div class="auth-success" id="authSuccess">
        <div class="success-title">Password Updated</div>
        <p>You can now sign in with your new password.</p>
        <a href="index.html" class="btn btn-primary"
          style="margin-top:var(--sp-4);display:inline-flex;">Go to Sign In</a>
      </div>

      <form id="resetForm" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="newPassword">New Password <span class="required">*</span></label>
          <div class="password-wrapper">
            <input type="password" id="newPassword" class="form-input" placeholder="At least 8 characters"
              autocomplete="new-password" required>
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="password-strength">
            <div class="password-strength-fill" id="strengthFill"></div>
          </div>
          <div class="form-error hidden" id="passwordError">Password must be at least 8 characters.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm New Password <span class="required">*</span></label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter your password"
            autocomplete="new-password" required>
          <div class="form-error hidden" id="confirmError">Passwords do not match.</div>
        </div>

        <button type="submit" class="auth-submit" id="resetBtn">Update Password</button>
      </form>

      <div class="auth-alt">
        Remembered it? <a href="index.html">Sign in</a>
      </div>
    </div>

    <div class="auth-footer">© 2026 Nepo Mall Angeles City — FIRS v1.0</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script type="module">
    import { supabase } from './js/supabase-client.js';

    const form = document.getElementById('resetForm');
    const pw = document.getElementById('newPassword');
    const confirmPw = document.getElementById('confirmPassword');
    const pwError = document.getElementById('passwordError');
    const confirmError = document.getElementById('confirmError');
    const btn = document.getElementById('resetBtn');
    const authError = document.getElementById('authError');
    const authErrorText = document.getElementById('authErrorText');
    const authSuccess = document.getElementById('authSuccess');
    const strengthFill = document.getElementById('strengthFill');

    function showError(msg) {
      authErrorText.textContent = msg;
      authError.classList.add('show');
    }

    /* Supabase reads the recovery token out of the URL and exchanges it for a
       short-lived session. Until that session exists there is no user for
       updateUser() to act on, so the page waits for it rather than letting
       someone fill the form and hit a confusing error on submit. */
    let recoveryReady = false;

    supabase.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
        recoveryReady = true;
        authError.classList.remove('show');
      }
    });

    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) { recoveryReady = true; return; }
      // Give the SDK a moment to parse the token from the URL fragment.
      setTimeout(async () => {
        const { data: { session: later } } = await supabase.auth.getSession();
        if (later) { recoveryReady = true; return; }
        showError('This reset link is invalid or has expired. Request a new one from the sign-in page.');
        btn.disabled = true;
      }, 1500);
    })();

    document.getElementById('togglePassword').addEventListener('click', () => {
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    pw.addEventListener('input', () => {
      const v = pw.value;
      let score = 0;
      if (v.length >= 8) score++;
      if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
      if (/\d/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;
      const pct = [0, 25, 50, 75, 100][score];
      const colour = score <= 1 ? 'var(--danger-500)'
        : score === 2 ? 'var(--warning-500)'
          : 'var(--success-600)';
      strengthFill.style.width = pct + '%';
      strengthFill.style.background = colour;
      if (v.length >= 8) pwError.classList.add('hidden');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.classList.remove('show');

      let valid = true;
      if (pw.value.length < 8) {
        pwError.classList.remove('hidden');
        valid = false;
      } else {
        pwError.classList.add('hidden');
      }

      if (pw.value !== confirmPw.value) {
        confirmError.classList.remove('hidden');
        valid = false;
      } else {
        confirmError.classList.add('hidden');
      }

      if (!valid) return;

      if (!recoveryReady) {
        showError('This reset link is invalid or has expired. Request a new one from the sign-in page.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';

      const { error } = await supabase.auth.updateUser({ password: pw.value });

      if (error) {
        showError(error.message);
        btn.disabled = false;
        btn.textContent = 'Update Password';
        return;
      }

      /* Signed out deliberately. The recovery session is not a normal login,
         and leaving it active would keep anyone holding the emailed link
         signed in after the password had been changed. */
      await supabase.auth.signOut();

      form.style.display = 'none';
      authSuccess.classList.add('show');
    });
  </script>
</body>

</html>
