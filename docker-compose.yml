# ============================================================
#  Nepo Mall FIRS — run the web application and the classifier locally
#
#      docker compose up
#
#  Then open http://localhost:5500 (the classifier takes about 40 seconds to
#  load the model after starting).
#
#  DATABASE
#  --------
#  Logins and reports are stored in a Supabase project, so an internet
#  connection is required. By default this uses the public DEMO database:
#  fictional stores and reports, with the demo accounts listed in README.md.
#  To use your own copy of the database instead (see SETUP.md), copy
#  .env.example to .env in this folder and fill in your project's URL and
#  anon key. Docker Compose reads .env automatically.
#
#  Port 5500 is deliberate: the classifier only accepts browser requests from
#  the origins listed in serving/serve.py, and http://localhost:5500 is one.
#
#  To build the web image from source instead of pulling it:
#      docker build -f deploy/web/Dockerfile -t dexterctoribio/firs-web:1.0 .
# ============================================================
services:
  classifier:
    container_name: firs-classifier
    image: dexterctoribio/firs-classifier:1.0
    ports:
      - "7860:7860"
    environment:
      # Where the classifier reads the admin-managed safety terms from. The
      # defaults are the public demo database (see DATABASE above).
      FIRS_SUPABASE_URL: ${SUPABASE_URL:-https://qcrrxpflkdtdnylkzojj.supabase.co}
      FIRS_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjcnJ4cGZsa2R0ZG55bGt6b2pqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNzI3MDQsImV4cCI6MjEwNzY0ODcwNH0.wnZ_tLkhQUGa-oue7JZwOUCqnsw2O3kEwk7ierF6PjM}

  web:
    container_name: firs-web
    image: dexterctoribio/firs-web:1.0
    ports:
      - "5500:80"
    environment:
      # The browser, not the web container, calls the classifier, so this is
      # the classifier's address as seen from the browser.
      FIRS_API_BASE: http://localhost:7860
      # Defaults: the public demo database (see DATABASE above).
      SUPABASE_URL: ${SUPABASE_URL:-https://qcrrxpflkdtdnylkzojj.supabase.co}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjcnJ4cGZsa2R0ZG55bGt6b2pqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNzI3MDQsImV4cCI6MjEwNzY0ODcwNH0.wnZ_tLkhQUGa-oue7JZwOUCqnsw2O3kEwk7ierF6PjM}
    depends_on:
      - classifier
